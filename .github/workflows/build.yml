name: Build Bodega

# Every push builds and tests on all platforms.
# Releasing is merging: when main has a __version__ (bodega/__init__.py) that has no tag yet, this run tags it
# vX.Y.Z and publishes a GitHub Release with the downloads. Pushing a tag like v1.0.0 by hand still works too.
# Actions are pinned to exact commits (a tag can be moved; a commit can't). Update them deliberately.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # the build never needs to push
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version  # the exact Python every build uses
      - name: The checking tools, from their lock (each file's fingerprint checked, no setup scripts run)
        run: |
          pip install --require-hashes --only-binary :all: --no-deps -r requirements-lint.lock
      - name: Format check
        run: ruff format --check .
      - name: Lint (style, bugs, security)
        run: ruff check .
      - name: Type check (the parts with no Qt)
        run: mypy
      - name: The locks match requirements*.txt
        run: python scripts/lock.py --check
      - name: Known vulnerabilities in what ships (and what builds it), on every computer it's built for
        run: |
          python scripts/lock.py --everything > "$RUNNER_TEMP/everything.txt"
          pip-audit --strict --disable-pip --no-deps -r "$RUNNER_TEMP/everything.txt"
      - name: Software bill of materials (attached to the release)
        run: |
          mkdir -p sbom
          pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/everything.txt" -f cyclonedx-json -o sbom/Bodega-sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Bodega-sbom
          path: sbom/Bodega-sbom.cdx.json
          if-no-files-found: error
      - name: Is this a release?
        # main with a version that has no tag yet, or a tag pushed by hand (which must match the version: a
        # release whose app reports an older number keeps offering itself as an update)
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          v=$(python -c "import ast, pathlib; t = ast.parse(pathlib.Path('bodega/__init__.py').read_text()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          tag="v$v"
          release=false
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            if [ "$GITHUB_REF" != "refs/tags/$tag" ]; then
              echo "::error::Tag ${GITHUB_REF#refs/tags/} doesn't match __version__ $v in bodega/__init__.py. Bump the version, commit, then tag."
              exit 1
            fi
            release=true
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$EVENT" != "pull_request" ]; then
            if git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/$tag" > /dev/null; then
              echo "$tag is already released."
            else
              echo "$tag isn't released yet: this run releases it."
              release=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: lint
    timeout-minutes: 75  # a machine that stops answering ends here, not after six hours
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: mac-apple-silicon
          - os: macos-15-intel
            name: mac-intel
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # the build never needs to push

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version  # the exact Python every build uses

      - name: Linux libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libgl1 libcups2

      - name: Install Python packages, from the lock (each file's fingerprint checked, no setup scripts run)
        run: |
          python -m pip install "pip==25.2"
          pip install --require-hashes --only-binary :all: --no-deps -r requirements.lock

      - name: Run tests
        shell: bash
        timeout-minutes: 25  # a test that hangs fails the run here, instead of holding the machine for hours
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          # written out as it runs (a test that hangs shows where); pytest.log keeps it for the summary below
          python -m pytest -v -p no:cacheprovider 2>&1 | head -c 50000000 | tee pytest.log
          code=${PIPESTATUS[0]}
          # Qt can crash while Python shuts down AFTER every test has passed (Windows does this);
          # what counts is pytest's own verdict on its last summary line.
          if [ $code -ne 0 ] && python -c "import re,sys; lines=[l for l in open('pytest.log',encoding='utf-8',errors='replace').read().splitlines() if l.startswith('=')]; sys.exit(0 if lines and re.search(r' passed', lines[-1]) and not re.search(r'failed|error', lines[-1]) else 1)"; then
            echo "All tests passed (exit code $code came from shutting down afterwards)."
            code=0
          fi
          if [ $code -ne 0 ]; then
            # Show the end of the test output on the run's summary page (readable without the full log).
            python -c "import sys; lines = open('pytest.log', encoding='utf-8', errors='replace').read().splitlines()[-60:]; print('::error title=Tests failed (exit $code)::' + '%0A'.join(l.replace('%', '%25').replace(chr(13), '') for l in lines))"
          fi
          exit $code

      - name: Screenshots, light and dark (to look at with the change)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/screenshot.py screenshots/light
          BODEGA_LOOK=dark python tests/screenshot.py screenshots/dark
          BODEGA_ACCENT=yellow BODEGA_SIZE=1280x700 python tests/screenshot.py screenshots/yellow-smallest

      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Stamp the commit
        shell: bash
        run: printf '"""Which commit this copy of Bodega was built from."""\n\nCOMMIT = "%s"\n' "${GITHUB_SHA::7}" > bodega/_build.py

      - name: Build app
        run: pyinstaller bodega.spec --noconfirm

      # the signing certificate is only handed to the signing step (never to installs, tests or the build)
      - name: Is signing set up?
        id: signing
        if: runner.os == 'macOS'
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
        run: echo "ready=$HAS_CERT" >> "$GITHUB_OUTPUT"

      # ---------- smoke tests: launch the packaged app, open a sample rental, save its agreement as a PDF
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/Bodega.app/Contents/MacOS/Bodega --smoke-test
          dist/Bodega.app/Contents/MacOS/Bodega cli sample smoke.pdf --doc agreement
          test -s smoke.pdf
          dist/Bodega.app/Contents/MacOS/Bodega cli update-check

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/Bodega/Bodega --smoke-test
          dist/Bodega/Bodega cli sample smoke.pdf --doc inventory
          test -s smoke.pdf
          dist/Bodega/Bodega cli update-check

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\Bodega\Bodega.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath dist\Bodega\Bodega.exe -ArgumentList "cli","sample","smoke.pdf" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "CLI smoke test failed: $($p.ExitCode)" }
          if (-not (Test-Path smoke.pdf)) { throw "no PDF" }
          $p = Start-Process -FilePath dist\Bodega\Bodega.exe -ArgumentList "cli","update-check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "update check failed: $($p.ExitCode)" }

      # ---------- optional: sign + notarize on macOS (only if you add the secrets — see README)
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.ready == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/cert.p12"
          trap 'rm -f "$CERT"' EXIT  # gone even if a step below fails
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import "$CERT" -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          find dist/Bodega.app -type f \( -perm -u+x -o -name "*.dylib" -o -name "*.so" \) -print0 | \
            xargs -0 codesign --force --timestamp --options runtime --entitlements packaging/macos/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" || true
          codesign --force --deep --timestamp --options runtime --entitlements packaging/macos/entitlements.plist --sign "$MACOS_SIGN_IDENTITY" dist/Bodega.app
          ditto -c -k --keepParent dist/Bodega.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Bodega.app

      # ---------- package
      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmg
          cp -R dist/Bodega.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Bodega" -srcfolder dmg -ov -format UDZO "out/Bodega-${{ matrix.name }}.dmg"

      - name: Package (Windows .zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist\Bodega -DestinationPath out\Bodega-windows-portable.zip

      - name: Package (Windows installer)
        if: runner.os == 'Windows'  # Bodega-windows-setup.exe is a contract (README, update.asset_name): no release without it
        shell: pwsh
        run: |
          $want = "6.7.1"  # the Inno Setup every installer is built with (pinned; change it on purpose, with a test build)
          $key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1"
          $have = (Get-ItemProperty $key -ErrorAction SilentlyContinue).DisplayVersion
          if ($have -ne $want) { choco install innosetup --version $want -y --no-progress --allow-downgrade --force }
          $v = (python -c "import bodega; print(bodega.__version__)")
          $out = & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$v packaging\windows\bodega.iss
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) { exit $code }
          $engine = [regex]::Match(($out -join "`n"), 'Compiler engine version: Inno Setup ([\d.]+)').Groups[1].Value
          if ($engine -ne $want) { Write-Output "::error title=Inno Setup::built with $engine, not the pinned $want"; exit 1 }
          Copy-Item packaging\windows\Output\Bodega-Setup.exe out\Bodega-windows-setup.exe

      - name: Package (Linux .tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p out
          cp packaging/linux/install.sh packaging/linux/bodega.desktop bodega/assets/icon.png dist/Bodega/
          chmod +x dist/Bodega/install.sh
          tar -C dist -czf out/Bodega-linux-x64.tar.gz Bodega

      - name: Package (Linux AppImage, one file)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          bash packaging/linux/build_appimage.sh dist/Bodega out/Bodega-linux-x64.AppImage
          out/Bodega-linux-x64.AppImage --smoke-test

      - name: Each download stays a reasonable size
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sys
          cap = 400 * 1024 * 1024  # well above what a download is today: only a runaway build fails
          big = [(f.name, f.stat().st_size) for f in pathlib.Path("out").iterdir() if f.stat().st_size > cap]
          for name, size in big:
              print(f"::error title=Too big::{name} is {size / 1e6:.0f} MB (the cap is {cap / 1e6:.0f} MB)")
          sys.exit(1 if big else 0)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Bodega-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: needs.lint.outputs.release == 'true'
    needs: [lint, build]
    runs-on: ubuntu-latest
    concurrency: release  # one release at a time
    permissions:
      contents: write
    steps:
      - name: Still not released?
        # two quick merges can both see the same new version; only the first one releases it
        id: still
        env:
          TAG: ${{ needs.lint.outputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] && git ls-remote --exit-code --tags "$REPO_URL" "refs/tags/$TAG" > /dev/null; then
            echo "$TAG was released by another run."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.still.outputs.go == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # only the changelog is read
      - if: steps.still.outputs.go == 'true'
        name: Release notes
        # this version's CHANGELOG entries, then the downloads: what the update window shows people
        env:
          TAG: ${{ needs.lint.outputs.tag }}
        run: python3 scripts/release_notes.py "$TAG" > "$RUNNER_TEMP/release-notes.md"
      - if: steps.still.outputs.go == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: Bodega-*  # the downloads only (never the screenshots)
          merge-multiple: true
      - if: steps.still.outputs.go == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.lint.outputs.tag }}
          target_commitish: ${{ github.sha }}  # on main, the tag is made here, on the commit that was built
          files: artifacts/*
          body_path: ${{ runner.temp }}/release-notes.md
