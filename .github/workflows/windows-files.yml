name: Windows tests, a part a machine

# Diagnosis: parts of the tests each on its own Windows machine, so one that stops a machine names itself while the
# others report. Runs when this file changes on the work branch (re-run it from its run). Not part of the build;
# removed once the Windows runs pass. Round 2: each test of test_untrusted.py (the file that stopped its machine),
# and everything else in one run.
on:
  push:
    branches: [claude/awesome-bohr-9d9eva]
    paths: [.github/workflows/windows-files.yml]

permissions:
  contents: read

jobs:
  part:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part:
          - "--ignore=tests/test_untrusted.py"
          - "tests/test_untrusted.py -k test_a_cell_longer_than_csv_allows_is_said_plainly"
          - "tests/test_untrusted.py -k test_a_logo_from_before_is_drawn_from_its_cleaned_drawing"
          - "tests/test_untrusted.py -k test_a_page_that_trickles_in_is_stopped"
          - "tests/test_untrusted.py -k test_a_sheet_too_big_to_be_a_gear_list_is_said_plainly"
          - "tests/test_untrusted.py -k test_adding_an_svg_logo_keeps_the_cleaned_one"
          - "tests/test_untrusted.py -k test_an_svg_logo_keeps_only_its_drawing"
          - "tests/test_untrusted.py -k test_an_svg_with_a_doctype_is_refused"
          - "tests/test_untrusted.py -k test_links_in_release_notes_open_only_when_theyre_plain_web_links"
          - "tests/test_untrusted.py -k test_something_that_isnt_a_usable_svg_is_said_plainly"
          - "tests/test_untrusted.py -k test_the_log_is_one_json_line_each_without_names_or_paths"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Install Python packages, from the lock
        run: |
          python -m pip install "pip==25.2"
          pip install --require-hashes --only-binary :all: --no-deps -r requirements.lock
      - name: The tests
        shell: bash
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v -p no:cacheprovider ${{ matrix.part }} 2>&1 | head -c 20000000
